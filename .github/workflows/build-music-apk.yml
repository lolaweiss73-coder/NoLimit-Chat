name: Build Music Without Limits APK

on:
  push:
    branches:
      - music-without-limits-android
    paths:
      - 'android-music/**'
      - '.github/workflows/build-music-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-music
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-music/app/build/outputs/apk/debug/app-debug.apk Music-Without-Limits-2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Without-Limits-2.0
          path: Music-Without-Limits-2.0.apk
          if-no-files-found: error

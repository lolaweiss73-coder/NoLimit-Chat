name: Build Music Without Limits APK

on:
  push:
    branches:
      - music-without-limits-android
    paths:
      - 'android-music/**'
      - '.github/workflows/build-music-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-music
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-music/app/build/outputs/apk/debug/app-debug.apk Music-Without-Limits-2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Without-Limits-2.0
          path: Music-Without-Limits-2.0.apk

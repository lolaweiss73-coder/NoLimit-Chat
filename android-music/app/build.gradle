plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avi.musicwithoutlimits'
    compileSdk 35

    defaultConfig {
        applicationId "com.avi.musicwithoutlimits"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
